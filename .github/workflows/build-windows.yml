name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

env:
  NODE_VERSION: 24

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runs_on: windows-2025
            platform: win
            arch: x64
            targets: nsis,portable
          - name: Windows ARM64
            runs_on: windows-11-arm
            platform: win
            arch: arm64
            targets: nsis,portable
          - name: macOS x64
            runs_on: macos-15-intel
            platform: mac
            arch: x64
            targets: dmg,zip
          - name: macOS ARM64
            runs_on: macos-latest
            platform: mac
            arch: arm64
            targets: dmg,zip
          - name: Linux x64
            runs_on: ubuntu-24.04
            platform: linux
            arch: x64
            targets: AppImage,deb
          - name: Linux ARM64
            runs_on: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            targets: AppImage,deb
    runs-on: ${{ matrix.runs_on }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Validate source
        run: npm run check

      - name: Build application
        shell: bash
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          WIN_CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          MAC_CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: MinecraftAccountLauncher-${{ matrix.platform }}-${{ matrix.arch }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(find artifacts -type f \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' -o -name '*.deb' \) -print)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No build artifacts found."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" "${files[@]}" --generate-notes --title "MinecraftAccountLauncher $TAG"
          fi
