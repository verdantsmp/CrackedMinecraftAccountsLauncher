name: Validate

on:
  workflow_dispatch:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  syntax:
    name: Validate source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check source
        run: npm run check
